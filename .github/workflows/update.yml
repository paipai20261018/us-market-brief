name: 更新盘前简报数据

on:
  schedule:
    # UTC 00:30 / 01:30 = 北京时间 08:30 / 09:30（美股收盘后，工作日）
    - cron: '30 0 * * 2-6'
    - cron: '30 1 * * 2-6'
    # UTC 22:00 = 北京时间 06:00（美股刚收盘，补一次）
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      - name: 抓取数据
        run: python fetch_data.py

      - name: 提交 data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data.json
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 更新盘前简报数据 $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
